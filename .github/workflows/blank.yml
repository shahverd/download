name: Auto Download and Commit

on: 
  push:
    branches:
      [main, master]

jobs:
  download-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    
      - name: Download file
        run: |
          curl -L -o downloaded_file "https://www.digikala.com/"
      
      - name: Commit with URL as message
        run: |
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add downloaded_file
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            # Using the URL as the commit message
            git commit -m "mmmnmmn"
            git push origin ${{ github.event.client_payload.target_branch || github.event.inputs.target_branch }}
          fi

name: Auto Download and Commit

on: 
  push:
    branches:
    [main, master]
  workflow_dispatch:
    inputs:
      file_url:
        description: 'File URL'
        required: true
      target_branch:
        description: 'Target branch'
        required: true
        default: 'main'

jobs:
  download-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.target_branch || github.event.inputs.target_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Download file
        run: |
          FILE_URL="${{ github.event.client_payload.file_url || github.event.inputs.file_url }}"
          curl -L -o downloaded_file "$FILE_URL"
      
      - name: Commit with URL as message
        run: |
          FILE_URL="${{ github.event.client_payload.file_url || github.event.inputs.file_url }}"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add downloaded_file
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            # Using the URL as the commit message
            git commit -m "$FILE_URL"
            git push origin ${{ github.event.client_payload.target_branch || github.event.inputs.target_branch }}
          fi

name: Auto Download and Commit

on: 
  push:
    branches:
      [master]

jobs:
  download-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: downl  # Checkout the downl branch directly
          
      - name: Extract URL from README and download file
        run: |
          # Check if README file exists
          if [ -f "README.md" ]; then
            # Extract URL from README (looks for http:// or https:// patterns)
            # This extracts the first URL found in the README
            URL=$(grep -oP 'https?://[^\s]+' README.md | head -1)
            
            if [ -n "$URL" ]; then
              echo "Found URL: $URL"
              # Download the file using the extracted URL
              # Extract filename from URL or use a default name
              FILENAME=$(basename "$URL" | cut -d '?' -f1)
              if [ -z "$FILENAME" ]; then
                FILENAME="downloaded_file"
              fi
              
              # Download the file
              curl -L -o "$FILENAME" "$URL"
              echo "Downloaded file: $FILENAME"
            else
              echo "No URL found in README.md"
              exit 1
            fi
          else
            echo "README.md not found"
            exit 1
          fi
          
      - name: Commit and push downloaded file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add all new/changed files
          git add .
          
          # Get the URL from README again for the commit message
          URL=$(grep -oP 'https?://[^\s]+' README.md | head -1)
          
          # Commit with the URL as the message
          git commit -m "Downloaded from: $URL" || echo "No changes to commit"
          
          # Push to downl branch
          git push origin downl

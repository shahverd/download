name: Thank Committer on Push

on:
  push:
    branches: [ main, master ]

jobs:
  thank:
    runs-on: ubuntu-latest
    steps:
      - name: Comment on commit
        uses: peter-evans/commit-comment@v3
        with:
          body: |
            🙏 Thank you @${{ github.actor }} for your contribution!
            
            Commit: ${{ github.sha }}
            Message: HEYYYYYYYY!!! ${{ github.event.head_commit.message }}
